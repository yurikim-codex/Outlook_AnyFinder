[package]
name = "outlook-anyfinder"
version = "1.0.0"
description = "OutLook AnyFinder — Outlook 로컬 메일 검색 (React + Tauri 셸)"
authors = ["SESUNG Team"]
edition = "2021"
rust-version = "1.77.2"

# 라이브러리명 — main.rs에서 outlook_anyfinder_lib::run() 호출
[lib]
name = "outlook_anyfinder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Windows 전용: CTRL_BREAK_EVENT (사이드카 정상 종료 폴백 — MIGRATION_PLAN 리스크 3)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
